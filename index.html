<script>
(async () => {
  "use strict";

  const byId = (id) => document.getElementById(id);
  const embedded = byId("embedded-catalog");
  const response = embedded ? null : await fetch("./catalog.json", { cache: "no-cache" });
  if (response && !response.ok) throw new Error("Каталог не загрузился.");
  const data = embedded ? JSON.parse(embedded.textContent) : await response.json();
  const types = {
    all: "Все",
    street: "Улицы и площади",
    transport: "Транспорт",
    district: "Районы",
    landmark: "Здания",
    nature: "Парки и вода",
  };
  const placeList = byId("places");
  const search = byId("search");
  const catalog = byId("catalog");
  const filterButtons = new Map();
  const rowButtons = new Map();
  const visibleMentions = new Map();
  const placesById = new Map(data.places.map((place) => [place.id, place]));
  const songs = data.songs.filter((song) => song.mentions.some(({ place }) => placesById.has(place)));
  const songsById = new Map(songs.map((song) => [song.id, song]));
  const mentionsByPlace = new Map(data.places.map((place) => [place.id, []]));
  for (const song of songs) {
    for (const mention of song.mentions) mentionsByPlace.get(mention.place)?.push({ ...mention, song: song.id });
  }
  const placeOrder = data.places.filter(({ id }) => mentionsByPlace.get(id).length)
    .sort((a, b) => a.name.localeCompare(b.name, "ru"));
  let filter = "all";
  let activePlace = "";
  let visible = [];

  const mapPanel = document.querySelector(".map-panel");
  const yandexCanvas = byId("yandex-canvas");
  const yandexPopup = byId("yandex-popup");
  const popupContent = byId("yandex-popup-content");
  const mapNotice = byId("map-notice");
  const retryMap = byId("retry-map");
  const fitButton = byId("fit-map");
  const yandexKey = document.querySelector('meta[name="yandex-js-api-key"]')?.content.trim();
  const canLoadMap = ["https:", "http:"].includes(location.protocol) && Boolean(yandexKey);
  let yandexMap;
  let yandexReady;
  let yandexCluster;
  let yandexRoute;
  let popupAnchor;
  let popupMarker;
  let layoutFrame;
  const yandexMarkers = new Map();

  function showNotice(message) {
    mapNotice.hidden = !message;
    mapNotice.textContent = message;
  }

  function element(tag, className, value) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (value) node.textContent = value;
    return node;
  }

  function loadYandex() {
    if (yandexReady) return yandexReady;
    yandexReady = new Promise((resolve, reject) => {
      const script = document.createElement("script");
      const timeout = setTimeout(fail, 10000);
      function fail() {
        clearTimeout(timeout);
        script.remove();
        reject(new Error("Yandex Maps API unavailable"));
      }
      script.referrerPolicy = "strict-origin-when-cross-origin";
      script.src = "https://api-maps.yandex.ru/v3/?lang=ru_RU&apikey=" + encodeURIComponent(yandexKey);
      script.onerror = fail;
      script.onload = async () => {
        try {
          if (!window.ymaps3?.ready) return fail();
          await window.ymaps3.ready;
          clearTimeout(timeout);
          resolve(window.ymaps3);
        } catch {
          fail();
        }
      };
      document.head.append(script);
    }).catch((error) => {
      yandexReady = undefined;
      throw error;
    });
    return yandexReady;
  }

  async function openYandex() {
    retryMap.hidden = true;
    showNotice("Загрузка Яндекс Карт…");
    try {
      const sdk = await loadYandex();
      yandexCanvas.hidden = false;
      yandexMap = new sdk.YMap(yandexCanvas, {
        location: { center: [37.613, 55.742], zoom: 11 },
        zoomRange: { min: 9, max: 19 },
        margin: [62, 28, 42, 28],
      });
      yandexMap.addChild(new sdk.YMapDefaultSchemeLayer());
      yandexMap.addChild(new sdk.YMapDefaultFeaturesLayer());
      yandexMap.addChild(new sdk.YMapListener({
        onUpdate: queuePopupLayout,
        onResize: queuePopupLayout,
      }));
      const controls = new sdk.YMapControls({ position: "right" });
      const zoom = element("div", "yandex-zoom");
      for (const [label, text, step] of [["Приблизить", "+", 1], ["Отдалить", "−", -1]]) {
        const button = element("button", "map-button", text);
        button.type = "button";
        button.setAttribute("aria-label", label);
        button.addEventListener("click", () => yandexMap.setLocation({ zoom: yandexMap.zoom + step }));
        zoom.append(button);
      }
      controls.addChild(new sdk.YMapControl({}, zoom));
      yandexMap.addChild(controls);
      showNotice("");
      fitButton.hidden = false;
      fitButton.disabled = !visible.length;
      refreshYandexMarkers();
      if (activePlace) showYandexPlace(placesById.get(activePlace), true);
      else fitMap();
      void enableYandexClusters(sdk);
    } catch {
      yandexMap?.destroy();
      yandexMap = undefined;
      yandexCluster = undefined;
      yandexMarkers.clear();
      yandexRoute = undefined;
      popupMarker = undefined;
      popupAnchor = undefined;
      yandexCanvas.hidden = true;
      yandexPopup.dataset.facing = "none";
      fitButton.hidden = true;
      retryMap.hidden = false;
      showNotice("Яндекс Карты не загрузились. Места и песни доступны в списке.");
    }
  }

  function yandexMarker(place, source) {
    const pin = element("button", `map-pin yandex-pin ${place.group}`);
    pin.type = "button";
    pin.dataset.place = place.id;
    pin.setAttribute("aria-label", place.name);
    pin.title = place.name;
    pin.classList.toggle("selected", activePlace === place.id);
    pin.append(element("span"));
    pin.addEventListener("click", () => showYandexPlace(place, false));
    const coordinates = [...place.point].reverse();
    return new window.ymaps3.YMapMarker(source ? { coordinates, source } : { coordinates }, pin);
  }

  async function enableYandexClusters(sdk) {
    const instance = yandexMap;
    try {
      const { YMapClusterer, clusterByGrid } = await sdk.import("@yandex/ymaps3-clusterer");
      if (instance !== yandexMap) return;
      const source = "song-map-markers";
      instance.addChild(new sdk.YMapFeatureDataSource({ id: source }));
      instance.addChild(new sdk.YMapLayer({ source, type: "markers", zIndex: 1800 }));
      const clusterer = new YMapClusterer({
        features: [],
        method: clusterByGrid({ gridSize: 44 }),
        marker: ({ id }) => yandexMarker(placesById.get(id), source),
        cluster: (coordinates, features) => {
          const button = element("button", "map-cluster yandex-cluster", String(features.length));
          button.type = "button";
          button.setAttribute("aria-label", `Мест: ${features.length}. Приблизить`);
          button.addEventListener("click", () => instance.setLocation({ center: coordinates, zoom: Math.min(19, instance.zoom + 2) }));
          return new sdk.YMapMarker({ coordinates, source }, button);
        },
      });
      instance.addChild(clusterer);
      for (const marker of yandexMarkers.values()) instance.removeChild(marker);
      yandexMarkers.clear();
      yandexCluster = clusterer;
      refreshYandexMarkers();
    } catch {
      // Individual pins remain available when the optional cluster module is unavailable.
    }
  }

  function refreshYandexMarkers() {
    if (yandexCluster) {
      yandexCluster.update({ features: visible.map((place) => ({
        id: place.id, type: "Feature", geometry: { type: "Point", coordinates: [...place.point].reverse() },
        properties: {},
      })) });
      return;
    }
    for (const marker of yandexMarkers.values()) yandexMap.removeChild(marker);
    yandexMarkers.clear();
    for (const place of visible) {
      const marker = yandexMarker(place);
      yandexMarkers.set(place.id, marker);
      yandexMap.addChild(marker);
    }
  }

  function queuePopupLayout() {
    if (popupAnchor && !layoutFrame) layoutFrame = requestAnimationFrame(positionPopup);
  }

  function positionPopup() {
    layoutFrame = undefined;
    if (!popupAnchor?.isConnected) return;
    const panel = mapPanel.getBoundingClientRect();
    const anchor = popupAnchor.getBoundingClientRect();
    const x = anchor.left - panel.left;
    const y = anchor.top - panel.top;
    if (x <= 0 || y <= 0 || x >= panel.width || y >= panel.height) {
      yandexPopup.dataset.facing = "offscreen";
      return;
    }
    const inset = 12;
    const gap = 19;
    const width = Math.min(330, panel.width - 2 * inset);
    const left = Math.max(inset, Math.min(x - width / 2, panel.width - width - inset));
    yandexPopup.style.setProperty("--popup-width", width + "px");
    yandexPopup.style.setProperty("--popup-x", left + "px");
    yandexPopup.style.setProperty("--popup-tail", Math.max(12, Math.min(width - 12, x - left)) + "px");
    const top = 62;
    const bottom = panel.height - 45;
    const above = y - gap - top;
    const below = bottom - y - gap;
    const preferredHeight = Math.min(360, popupContent.scrollHeight);
    const showAbove = above >= preferredHeight || above >= below;
    const height = Math.max(1, Math.min(360, showAbove ? above : below));
    yandexPopup.style.setProperty("--popup-height", height + "px");
    const cardHeight = Math.min(height, popupContent.scrollHeight);
    const offset = showAbove ? y - gap - cardHeight : y + gap;
    yandexPopup.style.setProperty("--popup-y", offset + "px");
    yandexPopup.dataset.facing = showAbove ? "above" : "below";
  }

  function closeYandexPopup() {
    yandexPopup.hidden = true;
    cancelAnimationFrame(layoutFrame);
    layoutFrame = undefined;
    if (popupMarker) yandexMap?.removeChild(popupMarker);
    if (yandexRoute) yandexMap?.removeChild(yandexRoute);
    popupMarker = undefined;
    popupAnchor = undefined;
    yandexRoute = undefined;
    setActive("");
  }

  function showYandexPlace(place, zoomIn) {
    const mentions = visibleMentions.get(place.id);
    if (!mentions) return;
    closeYandexPopup();
    const coordinates = [...place.point].reverse();
    if (zoomIn && yandexMap) yandexMap.setLocation({ center: coordinates, zoom: placeZoom(place) });
    setActive(place.id);
    popupContent.replaceChildren(popup(place, mentions));
    yandexPopup.dataset.facing = yandexMap ? "offscreen" : "none";
    yandexPopup.hidden = false;
    popupContent.scrollTop = 0;
    if (!yandexMap) return;
    popupAnchor = element("span", "yandex-popup-anchor");
    popupAnchor.setAttribute("aria-hidden", "true");
    popupMarker = new window.ymaps3.YMapMarker({ coordinates, hideOutsideViewport: false }, popupAnchor);
    yandexMap.addChild(popupMarker);
    queuePopupLayout();
    const path = routePath(place);
    if (path?.length) {
      const lines = Array.isArray(path[0][0]) ? path : [path];
      const color = getComputedStyle(document.documentElement).getPropertyValue(`--${place.group}`).trim();
      yandexRoute = new window.ymaps3.YMapFeature({
        geometry: { type: "MultiLineString", coordinates: lines.map((line) => line.map((point) => [...point].reverse())) },
        style: { stroke: [{ width: 4, color }] },
      });
      yandexMap.addChild(yandexRoute);
    }
  }

  function normalize(text) {
    return text.toLocaleLowerCase("ru").replaceAll("ё", "е").replace(/[^\p{L}\p{N}]+/gu, " ").trim();
  }

  function geniusUrl(song) {
    if (song.genius === false) return "";
    const direct = typeof song.genius === "string" && /^https:\/\/(www\.)?genius\.com\//i.test(song.genius);
    return direct ? song.genius : `https://genius.com/search?q=${encodeURIComponent(song.artist + " " + song.title)}`;
  }

  function geniusLink(song) {
    const link = element("a", "", song.genius ? "Genius" : "Поиск на Genius");
    link.href = geniusUrl(song);
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    return link;
  }

  function popup(place, mentions) {
    const body = element("article", "popup");
    body.append(element("p", "popup-type", place.type), element("h2", "", place.name));
    if (place.note) body.append(element("p", "popup-note", place.note));
    if (yandexMap && !routePath(place) && yandexMap.zoom < placeZoom(place)) {
      const closer = element("button", "more-detail", "Показать вблизи");
      closer.type = "button";
      closer.addEventListener("click", () => showMarker(place));
      body.append(closer);
    }
    for (const id of new Set(mentions.map(({ song }) => song))) {
      const song = songsById.get(id);
      const row = element("section", "mention");
      row.append(element("h3", "", song.artist), element("p", "track", song.title));
      for (const mention of mentions.filter((item) => item.song === id)) {
        if (mention.quote) {
          const quote = mention.quote.replaceAll("«", "„").replaceAll("»", "“");
          row.append(element("blockquote", "", `«${quote}»`));
        }
        if (mention.note) row.append(element("p", "mention-note", mention.note));
      }
      if (song.genius !== false) {
        const sources = element("div", "source-links");
        sources.append(geniusLink(song));
        row.append(sources);
      }
      body.append(row);
    }
    return body;
  }

  function setActive(placeId) {
    if (activePlace === placeId) return;
    if (activePlace) {
      rowButtons.get(activePlace)?.removeAttribute("aria-current");
      yandexCanvas.querySelector(`[data-place="${CSS.escape(activePlace)}"]`)?.classList.remove("selected");
    }
    activePlace = placeId;
    if (placeId) {
      rowButtons.get(placeId)?.setAttribute("aria-current", "true");
      yandexCanvas.querySelector(`[data-place="${CSS.escape(placeId)}"]`)?.classList.add("selected");
    }
    const newHash = placeId ? `#place=${placeId}` : "";
    if (location.hash !== newHash) history.replaceState(null, "", location.pathname + location.search + newHash);
  }

  function showMarker(place) {
    if (window.matchMedia("(max-width: 740px)").matches) mapPanel.scrollIntoView({ block: "center" });
    showYandexPlace(place, true);
  }

  function routePath(place) {
    return place.path || METRO_ROUTES[place.id];
  }

  function placeZoom(place) {
    if (routePath(place) || ["mkad", "moskva-river", "garden-ring"].includes(place.id)) return 11;
    if (place.group === "district") return 14;
    return place.group === "landmark" || place.group === "transport" ? 17 : 16;
  }

  function getMatches(place, words) {
    const mentions = mentionsByPlace.get(place.id);
    const placeText = normalize([place.name, place.type, ...(place.aliases || [])].join(" "));
    if (words.every((word) => placeText.includes(word))) return mentions;
    return mentions.filter((mention) => {
      const song = songsById.get(mention.song);
      const haystack = placeText + " " + normalize([song.artist, song.title, mention.quote, mention.note].join(" "));
      return words.every((word) => haystack.includes(word));
    });
  }

  function fitMap() {
    if (!yandexMap || visible.length === 0) return;
    closeYandexPopup();
    if (visible.length === 1) {
      const [place] = visible;
      yandexMap.setLocation({ center: [...place.point].reverse(), zoom: placeZoom(place) });
      return;
    }
    const latitudes = visible.map((place) => place.point[0]);
    const longitudes = visible.map((place) => place.point[1]);
    yandexMap.setLocation({ bounds: [
      [Math.min(...longitudes), Math.min(...latitudes)],
      [Math.max(...longitudes), Math.max(...latitudes)],
    ] });
  }

  function addPlace(place, mentions) {
    const item = element("li");
    const button = element("button", `place-button ${place.group}`);
    button.type = "button";
    const symbol = element("span", "place-icon");
    symbol.setAttribute("aria-hidden", "true");
    const label = element("span");
    label.append(element("span", "place-name", place.name), element("span", "place-type", place.type));
    const songCount = new Set(mentions.map(({ song }) => song)).size;
    const count = element("span", "place-mentions", String(songCount));
    count.setAttribute("aria-label", `Песен: ${songCount}`);
    button.append(symbol, label, count);
    button.addEventListener("click", () => showMarker(place));
    rowButtons.set(place.id, button);
    item.append(button);
    return item;
  }

  function render() {
    closeYandexPopup();
    rowButtons.clear();
    visibleMentions.clear();
    visible = [];
    const list = document.createDocumentFragment();
    const query = normalize(search.value);
    const words = query ? query.split(" ") : [];
    for (const place of placeOrder) {
      if (filter !== "all" && place.group !== filter) continue;
      const matches = getMatches(place, words);
      if (!matches.length) continue;
      visible.push(place);
      visibleMentions.set(place.id, matches);
      list.append(addPlace(place, matches));
    }
    if (yandexMap) refreshYandexMarkers();
    placeList.replaceChildren(list);
    byId("result-count").textContent = visible.length === placeOrder.length ? String(placeOrder.length) : `${visible.length} из ${placeOrder.length}`;
    byId("empty").hidden = visible.length > 0;
    fitButton.disabled = visible.length === 0;
  }

  function changeFilter(group) {
    filter = group;
    for (const [key, button] of filterButtons) button.setAttribute("aria-pressed", String(key === group));
    render();
  }

  function showFromCatalog(placeId) {
    catalog.close();
    search.value = "";
    changeFilter("all");
    showMarker(placesById.get(placeId));
  }

  function renderCatalog() {
    const list = element("ol");
    for (const song of songs) {
      const item = element("li", "", `${song.artist} — «${song.title}»`);
      const placeNames = element("small");
      const places = [...new Set(song.mentions.map(({ place }) => place))].filter((id) => placesById.has(id));
      places.forEach((placeId, index) => {
        if (index) placeNames.append(" · ");
        const button = element("button", "catalog-place", placesById.get(placeId).name);
        button.type = "button";
        button.addEventListener("click", () => showFromCatalog(placeId));
        placeNames.append(button);
      });
      item.append(placeNames);
      list.append(item);
    }
    byId("catalog-content").append(list);
  }

  function downloadCsv(event) {
    const rows = [["Место", "Тип", "Цитата", "Исполнитель", "Песня", "Genius", "Пояснение", "Широта", "Долгота"]];
    for (const place of placeOrder) {
      for (const mention of mentionsByPlace.get(place.id)) {
        const song = songsById.get(mention.song);
        rows.push([place.name, place.type, mention.quote || "", song.artist, song.title, geniusUrl(song),
          mention.note || place.note || "", ...place.point]);
      }
    }
    const csv = rows.map((row) => row.map((cell) => {
      const value = String(cell);
      const safe = /^[=+\-@\t\r]/.test(value) ? "'" + value : value;
      return `"${safe.replaceAll('"', '""')}"`;
    }).join(";")).join("\r\n");
    const url = URL.createObjectURL(new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" }));
    event.currentTarget.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  const deepLink = new URLSearchParams(location.hash.slice(1)).get("place");
  for (const [key, label] of Object.entries(types)) {
    const button = element("button", "filter", label);
    button.type = "button";
    button.setAttribute("aria-pressed", String(key === filter));
    button.addEventListener("click", () => changeFilter(key));
    filterButtons.set(key, button);
    byId("filters").append(button);
  }
  search.addEventListener("input", render);
  byId("yandex-popup-close").addEventListener("click", closeYandexPopup);
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !yandexPopup.hidden && !catalog.open) closeYandexPopup();
  });
  fitButton.addEventListener("click", fitMap);
  retryMap.addEventListener("click", openYandex);
  new ResizeObserver(queuePopupLayout).observe(mapPanel);
  byId("home").addEventListener("click", (event) => {
    event.preventDefault();
    search.value = "";
    changeFilter("all");
    fitMap();
  });
  byId("catalog-button").addEventListener("click", () => catalog.showModal());
  byId("catalog-count").textContent = `Песен на карте — ${songs.length}`;
  byId("download-csv").addEventListener("click", downloadCsv);
  renderCatalog();

  render();
  fitButton.hidden = true;
  if (placesById.has(deepLink)) showYandexPlace(placesById.get(deepLink), false);
  if (canLoadMap) void openYandex();
  else showNotice("Места и песни доступны в списке.");
})().catch((error) => {
  const notice = document.getElementById("map-notice");
  notice.textContent = "Не удалось открыть карту. Обновите страницу.";
  notice.hidden = false;
  console.error(error);
});
</script>
</body>
</html>
