  <style>
:root {
  color-scheme: light;
  --ink: #1a1726;
  --muted: #5c5668;
  --paper: #f6f3fa;
  --line: #ddd7e6;
  --violet: #7045dc;
  --deep: #181722;
  --map-ink: #f7f4ff;
  --street: #bd9bff;
  --transport: #ffbd85;
  --district: #f3a9d3;
  --landmark: #f3e28f;
  --nature: #92dac1;
  font-family: "Golos Text", "Inter", system-ui, -apple-system, sans-serif;
  background: var(--deep);
  color: var(--ink);
}
* { box-sizing: border-box; }
body { margin: 0; }
button, input { font: inherit; }
button { cursor: pointer; }
button:focus-visible, a:focus-visible, input:focus-visible, .leaflet-marker-icon:focus-visible {
  outline: 3px solid var(--violet);
  outline-offset: 3px;
}
[hidden] { display: none !important; }
.topbar {
  display: flex;
  height: 64px;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: #fff;
  border-bottom: 1px solid var(--line);
  position: relative;
  z-index: 1001;
}
.brand { color: var(--ink); font-size: .97rem; font-weight: 780; text-decoration: none; display: inline-flex; align-items: center; gap: 11px; }
.brand-mark { display: flex; align-items: center; justify-content: center; gap: 2px; width: 32px; height: 32px; border-radius: 10px; background: var(--violet); }
.brand-mark i { width: 2px; height: 8px; border-radius: 4px; background: white; }
.brand-mark i:nth-child(2), .brand-mark i:nth-child(4) { height: 13px; }
.brand-mark i:nth-child(3) { height: 19px; }
.text-button { border: 1px solid var(--line); border-radius: 8px; color: var(--ink); background: #fff; font-size: .875rem; font-weight: 680; padding: 9px 13px; }
.text-button:hover { background: #eee8f7; }
.atlas { display: grid; grid-template-columns: minmax(320px, 386px) minmax(0, 1fr); height: calc(100vh - 64px); height: calc(100dvh - 64px); min-height: 510px; }
.sidebar { display: flex; min-height: 0; flex-direction: column; background: var(--paper); border-right: 1px solid var(--line); }
.intro { padding: 29px 24px 18px; }
h1, h2, p { margin: 0; }
h1 { font-size: clamp(3.1rem, 4.5vw, 4.5rem); font-weight: 850; line-height: .94; letter-spacing: -.078em; }
h1 span { color: var(--violet); }
.intro p { margin-top: 16px; font-size: .97rem; line-height: 1.52; color: var(--muted); max-width: 26ch; }
.search { display: flex; height: 44px; position: relative; align-items: center; margin: 23px 0 12px; }
.search input { width: 100%; height: 100%; padding: 0 11px 0 38px; background: white; border: 1px solid #c9c1d5; border-radius: 9px; color: var(--ink); }
.search input::placeholder { font-size: .92rem; color: #695f77; opacity: 1; }
.search-icon { position: absolute; z-index: 1; top: 14px; left: 14px; width: 13px; height: 13px; border: 1.8px solid #6a5d7b; border-radius: 50%; pointer-events: none; }
.search-icon::after { content: ""; position: absolute; width: 6px; height: 1.8px; background: #6a5d7b; top: 9px; left: 9px; transform: rotate(45deg); transform-origin: left center; }
.filters { display: flex; flex-wrap: wrap; gap: 6px; }
.filter { padding: 6px 10px; border-radius: 100px; border: 1px solid #d2c9dd; background: transparent; color: #443951; font-size: .875rem; line-height: 1.2; }
.filter:hover { border-color: #8e6cc4; }
.filter[aria-pressed=true] { color: white; border-color: #37244f; background: #37244f; }
.index-heading { flex: none; display: flex; justify-content: space-between; align-items: baseline; padding: 13px 24px 12px; border-top: 1px solid var(--line); }
.index-heading h2 { font-size: 1rem; }
.index-heading span { color: var(--muted); font-size: .875rem; }
.places { flex: 1; overflow: auto; overscroll-behavior: contain; scrollbar-color: #bdb1cd transparent; padding: 0 15px 16px; margin: 0; list-style: none; }
.places li + li { border-top: 1px solid var(--line); }
.place-button { display: grid; grid-template-columns: 25px minmax(0, 1fr) auto; gap: 10px; width: 100%; align-items: center; border: 0; border-radius: 7px; background: transparent; text-align: left; color: var(--ink); padding: 11px 9px; min-height: 59px; }
.place-button:hover, .place-button[aria-current=true] { background: #eae2f4; }
.place-button:focus-visible { outline-offset: -2px; }
.place-icon { place-self: center; width: 11px; height: 11px; border: 1px solid #5f4c75; border-radius: 50%; background: var(--place-color); }
.place-name { display: block; font-weight: 740; font-size: .95rem; line-height: 1.23; }
.place-type { display: block; color: var(--muted); font-size: .825rem; margin-top: 4px; }
.place-mentions { font-size: .8rem; color: var(--muted); }
.empty { padding: 10px 24px; color: var(--muted); line-height: 1.5; }
.map-panel { min-width: 0; min-height: 320px; position: relative; isolation: isolate; background: #171622; }
#map { position: absolute; inset: 0; background: #171622; font-family: inherit; }
.map-label { pointer-events: none; }
.map-label span { position: absolute; top: 0; left: 0; transform: translate(-50%, -50%); white-space: nowrap; font-size: .74rem; letter-spacing: .035em; color: #c0b7d2; text-shadow: 0 1px 2px #151420, 0 0 4px #151420; }
.leaflet-container .leaflet-control-attribution { color: #e2dbef; background: #211b2cea; font-size: .7rem; }
.leaflet-container .leaflet-control-attribution a { color: #e7d9ff; }
.map-toolbar { position: absolute; z-index: 600; top: 16px; right: 16px; }
.map-button, .leaflet-control-zoom a { background: #252134 !important; color: white !important; border-color: #4b425b !important; }
.map-button { border: 1px solid; border-radius: 8px; padding: 9px 13px; font-size: .875rem; font-weight: 680; box-shadow: 0 2px 9px #0005; }
.map-button:hover, .leaflet-control-zoom a:hover { background: #3d3450 !important; }
.leaflet-control-zoom.leaflet-bar { border: 1px solid #4b425b; border-radius: 8px; overflow: hidden; }
.leaflet-control-zoom a.leaflet-disabled { opacity: .55; }
.map-notice { position: absolute; z-index: 500; left: 12px; bottom: 28px; max-width: calc(100% - 24px); color: white; background: #282234; border: 1px solid #5f516d; border-radius: 8px; padding: 8px 12px; font-size: .875rem; }
.street { --place-color: var(--street); }
.transport { --place-color: var(--transport); }
.district { --place-color: var(--district); }
.landmark { --place-color: var(--landmark); }
.nature { --place-color: var(--nature); }
.map-pin { background: none; border: 0; border-radius: 50%; }
.map-pin span { display: block; width: 18px; height: 18px; margin: 6px; border-radius: 50%; background: var(--place-color); border: 3px solid #261c36; box-shadow: 0 0 0 1px var(--place-color), 0 2px 7px #000c; }
.map-pin:is(:hover, .selected) span { transform: scale(1.25); }
.map-pin.selected span { box-shadow: 0 0 0 2px white, 0 0 0 5px #7b4ddcb3; }
.map-cluster { display: grid; place-items: center; border-radius: 50%; border: 2px solid #d9c1ff; background: #6941af; color: white; font-weight: 790; box-shadow: 0 0 0 4px #a583dd4f, 0 2px 8px #000a; }
.leaflet-popup-content-wrapper, .leaflet-popup-tip { background: #fff; color: var(--ink); }
.leaflet-popup-content-wrapper { border-radius: 12px; }
.leaflet-popup-content { margin: 14px 16px; max-width: min(315px, 73vw); overflow-wrap: anywhere; }
.leaflet-popup-content .popup-type { margin: 0 23px 5px 0; font-size: .8rem; color: var(--muted); }
.popup h2 { margin: 0 16px 10px 0; font-size: 1.12rem; line-height: 1.17; letter-spacing: -.025em; }
.leaflet-popup-content .popup-note { margin: 4px 0 9px; color: var(--muted); font-size: .8rem; }
.mention { border-top: 1px solid var(--line); padding: 9px 0 3px; }
.mention + .mention { margin-top: 8px; }
.mention h3 { font-size: .85rem; line-height: 1.3; margin: 0; }
.mention .track { font-size: .81rem; margin: 2px 0 0; color: var(--muted); }
.mention blockquote { margin: 7px 0; padding-left: 9px; border-left: 2px solid #aa80ef; color: #2f2243; font-size: .94rem; line-height: 1.45; white-space: pre-line; }
.mention .mention-note { font-size: .8rem; color: var(--muted); margin: 6px 0; }
.source-links { display: flex; flex-wrap: wrap; gap: 6px 12px; }
.source-links a, .catalog-content a { color: #582eb0; font-size: .8rem; font-weight: 700; text-underline-offset: 2px; }
.leaflet-container a.leaflet-popup-close-button { top: 5px; right: 5px; color: #442e61; }
dialog { width: min(720px, calc(100% - 26px)); max-height: min(80dvh, 780px); padding: 0; border: 1px solid var(--line); border-radius: 15px; background: white; color: var(--ink); }
dialog::backdrop { background: #161221b8; }
.catalog-heading { display: flex; position: sticky; top: 0; z-index: 1; justify-content: space-between; align-items: flex-start; padding: 19px 22px 15px; gap: 14px; border-bottom: 1px solid var(--line); background: #fff; }
.catalog-heading h2 { font-size: 1.5rem; letter-spacing: -.035em; }
.catalog-heading p { color: var(--muted); font-size: .875rem; margin-top: 4px; line-height: 1.4; }
.catalog-actions { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 6px 16px; padding: 13px 22px 0; color: var(--muted); font-size: .875rem; }
.catalog-actions a { color: #582eb0; font-size: .875rem; font-weight: 700; text-underline-offset: 2px; }
.catalog-content { padding: 8px 22px 19px; }
.catalog-content ol { padding-left: 24px; margin: 8px 0 0; }
.catalog-content li { padding: 7px 0; line-height: 1.43; }
.catalog-content small { display: block; color: var(--muted); font-size: .85rem; }
.catalog-content .catalog-place { color: #582eb0; font-size: .875rem; background: transparent; border: 0; padding: 0; text-decoration: underline; text-underline-offset: 2px; }
@media (max-width: 740px) {
  .topbar { padding: 0 14px; height: 56px; }
  .atlas { display: flex; height: auto; min-height: 0; flex-direction: column; }
  .sidebar { display: contents; }
  .intro { order: 0; background: var(--paper); padding: 18px 15px 14px; }
  h1 { font-size: clamp(2.55rem, 9.8vw, 3.7rem); }
  .desktop-break { display: none; }
  .intro p { margin-top: 8px; max-width: none; }
  .search { margin-top: 13px; }
  .map-panel { order: 1; height: 52vh; height: max(320px, 52svh); }
  .map-toolbar { top: 10px; right: 10px; }
  .index-heading { order: 2; background: var(--paper); padding-inline: 15px; }
  .places { order: 3; background: var(--paper); padding-inline: 7px; overflow: initial; }
  .empty { order: 4; background: var(--paper); padding: 8px 15px 25px; }
  .leaflet-popup-content { margin: 12px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; animation-duration: 0s !important; }
}

</style>
  
  
  
  
</head>
<body>
  <header class="topbar">
    <a href="./" class="brand" id="home">
      <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
      Песни на карте
    </a>
    <button class="text-button" id="catalog-button" type="button">Список песен</button>
  </header>
  <main class="atlas">
    <aside class="sidebar" aria-label="Указатель мест">
      <div class="intro">
        <h1>Москва<br class="desktop-break"> в песнях<span>.</span></h1>
        <p>Улицы, районы и другие места из текстов песен.</p>
        <label class="search">
          <span class="search-icon" aria-hidden="true"></span>
          <input type="search" id="search" placeholder="Место, артист или песня" aria-label="Найти место, артиста или песню" autocomplete="off">
        </label>
        <div class="filters" id="filters" aria-label="Тип места"></div>
      </div>
      <div class="index-heading">
        <h2>Места</h2>
        <span id="result-count" aria-live="polite"></span>
      </div>
      <ul class="places" id="places"></ul>
      <p class="empty" id="empty" hidden>Совпадений нет. Попробуйте другой запрос или выберите все места.</p>
    </aside>
    <section class="map-panel" aria-label="Карта московских топонимов">
      <div id="map"></div>
      <div class="map-toolbar">
        <button id="fit-map" class="map-button" type="button">Показать все</button>
      </div>
      <p id="map-notice" class="map-notice" role="status" hidden></p>
      <noscript><p class="map-notice">Для карты нужен JavaScript.</p></noscript>
    </section>
  </main>
  <dialog id="catalog" aria-labelledby="catalog-title">
    <div class="catalog-heading">
      <div>
        <h2 id="catalog-title">Список песен</h2>
        <p id="catalog-count"></p>
      </div>
      <form method="dialog"><button class="text-button" type="submit">Закрыть</button></form>
    </div>
    <div class="catalog-actions">
      <a id="download-csv" href="#" download="toponimy-moskvy.csv">Скачать таблицу CSV</a>
      <a href="https://github.com/LazySquare/moscow-song-map#как-редактировать-песни" target="_blank" rel="noopener">Как редактировать песни</a>
      <span>Автор карты — <a href="https://github.com/LazySquare" target="_blank" rel="noopener">LazySquare</a></span>
    </div>
    <div id="catalog-content" class="catalog-content"></div>
  </dialog>

</script><script>
(async () => {
  "use strict";

  const byId = (id) => document.getElementById(id);
  const embedded = byId("embedded-catalog");
  const response = embedded ? null : await fetch("./catalog.json", { cache: "no-cache" });
  if (response && !response.ok) throw new Error("Каталог не загрузился.");
  const data = embedded ? JSON.parse(embedded.textContent) : await response.json();
  const types = {
    all: "Все",
    street: "Улицы и площади",
    transport: "Транспорт",
    district: "Районы",
    landmark: "Здания",
    nature: "Парки и вода",
  };
  const placeList = byId("places");
  const search = byId("search");
  const catalog = byId("catalog");
  const filterButtons = new Map();
  const markers = new Map();
  const rowButtons = new Map();
  const placesById = new Map(data.places.map((place) => [place.id, place]));
  const songs = data.songs.filter((song) => song.mentions.some(({ place }) => placesById.has(place)));
  const songsById = new Map(songs.map((song) => [song.id, song]));
  const mentionsByPlace = new Map(data.places.map((place) => [place.id, []]));
  for (const song of songs) {
    for (const mention of song.mentions) mentionsByPlace.get(mention.place)?.push({ ...mention, song: song.id });
  }
  const placeOrder = data.places.filter(({ id }) => mentionsByPlace.get(id).length)
    .sort((a, b) => a.name.localeCompare(b.name, "ru"));
  let filter = "all";
  let activePlace = "";
  let selection = 0;
  let highlightedPath;
  let visible = [];

  const map = L.map("map", {
    center: [55.742, 37.613],
    zoom: 11,
    minZoom: 9,
    maxZoom: 16,
    zoomSnap: 1,
    zoomControl: false,
    attributionControl: false,
    maxBounds: [[55.19, 36.73], [56.19, 38.45]],
  });
  L.control.attribution({ prefix: false }).addTo(map).addAttribution(
    '© <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener">OpenStreetMap</a>',
  );
  L.control.zoom({
    position: "bottomright",
    zoomInTitle: "Приблизить",
    zoomOutTitle: "Отдалить",
  }).addTo(map);
  const geometry = map.createPane("context");
  geometry.style.zIndex = "180";
  geometry.style.pointerEvents = "none";
  const contextStyles = {
    district: { color: "#474158", weight: 1, opacity: .85, fillColor: "#2a283d", fillOpacity: .82 },
    water: { color: "#587a99", weight: 4, opacity: .95 },
    road: { color: "#7a627f", weight: 2, opacity: .9, dashArray: "4 4" },
  };
  L.geoJSON(MAP_CONTEXT, {
    pane: "context",
    interactive: false,
    style: ({ properties }) => contextStyles[properties.kind],
  }).addTo(map);
  const labelPane = map.createPane("map-labels");
  labelPane.style.zIndex = "190";
  labelPane.style.pointerEvents = "none";
  const labels = L.layerGroup(MAP_LABELS.map(({ point, name }) => L.marker(point, {
    pane: "map-labels",
    interactive: false,
    keyboard: false,
    icon: L.divIcon({ className: "map-label", html: element("span", "", name), iconSize: [0, 0] }),
  })));
  map.on("zoomend", () => {
    if (map.getZoom() >= 10) labels.addTo(map);
    else labels.remove();
  });

  function element(tag, className, value) {
    const node = document.createElement(tag);
    if (className) node.className = className;
    if (value) node.textContent = value;
    return node;
  }

  const clustered = typeof L.markerClusterGroup === "function";
  const layer = clustered ? L.markerClusterGroup({
    maxClusterRadius: 38,
    showCoverageOnHover: false,
    spiderfyDistanceMultiplier: 1.35,
    iconCreateFunction(cluster) {
      return L.divIcon({
        className: "map-cluster",
        html: String(cluster.getChildCount()),
        iconSize: [32, 32],
      });
    },
  }) : L.layerGroup();
  layer.addTo(map);

  function normalize(text) {
    return text.toLocaleLowerCase("ru").replaceAll("ё", "е").replace(/[^\p{L}\p{N}]+/gu, " ").trim();
  }

  function geniusUrl(song) {
    const direct = typeof song.genius === "string" && /^https:\/\/(www\.)?genius\.com\//i.test(song.genius);
    return direct ? song.genius : `https://genius.com/search?q=${encodeURIComponent(song.artist + " " + song.title)}`;
  }

  function geniusLink(song) {
    const link = element("a", "", song.genius ? "Genius" : "Поиск на Genius");
    link.href = geniusUrl(song);
    link.target = "_blank";
    link.rel = "noopener noreferrer";
    return link;
  }

  function popup(place, mentions) {
    const body = element("article", "popup");
    body.append(element("p", "popup-type", place.type), element("h2", "", place.name));
    if (place.note) body.append(element("p", "popup-note", place.note));
    for (const id of new Set(mentions.map(({ song }) => song))) {
      const song = songsById.get(id);
      const row = element("section", "mention");
      row.append(element("h3", "", song.artist), element("p", "track", song.title));
      for (const mention of mentions.filter((item) => item.song === id)) {
        const quote = mention.quote.replaceAll("«", "„").replaceAll("»", "“");
        row.append(element("blockquote", "", `«${quote}»`));
        if (mention.note) row.append(element("p", "mention-note", mention.note));
      }
      const sources = element("div", "source-links");
      sources.append(geniusLink(song));
      row.append(sources);
      body.append(row);
    }
    return body;
  }

  function setActive(placeId) {
    if (activePlace === placeId) return;
    if (activePlace) {
      rowButtons.get(activePlace)?.removeAttribute("aria-current");
      markers.get(activePlace)?.getElement()?.classList.remove("selected");
    }
    activePlace = placeId;
    if (placeId) {
      rowButtons.get(placeId)?.setAttribute("aria-current", "true");
      markers.get(placeId)?.getElement()?.classList.add("selected");
    }
    const newHash = placeId ? `#place=${placeId}` : "";
    if (location.hash !== newHash) history.replaceState(null, "", location.pathname + location.search + newHash);
  }

  function showMarker(place) {
    const currentSelection = ++selection;
    const marker = markers.get(place.id);
    if (!marker) return;
    if (window.matchMedia("(max-width: 740px)").matches) {
      byId("map").scrollIntoView({ block: "center" });
    }
    const open = () => {
      if (currentSelection === selection) marker.openPopup();
    };
    if (clustered) layer.zoomToShowLayer(marker, open);
    else {
      map.panTo(marker.getLatLng());
      open();
    }
  }

  function getMatches(place, words) {
    const mentions = mentionsByPlace.get(place.id);
    const placeText = normalize([place.name, place.type, ...(place.aliases || [])].join(" "));
    if (words.every((word) => placeText.includes(word))) return mentions;
    return mentions.filter((mention) => {
      const song = songsById.get(mention.song);
      const haystack = placeText + " " + normalize([song.artist, song.title, mention.quote].join(" "));
      return words.every((word) => haystack.includes(word));
    });
  }

  function fitMap() {
    if (visible.length === 0) return;
    if (visible.length === 1) {
      map.setView(visible[0].point, 14);
      return;
    }
    const bounds = L.latLngBounds(visible.map((place) => place.point));
    map.fitBounds(bounds, { paddingTopLeft: [34, 68], paddingBottomRight: [38, 38], maxZoom: 14 });
  }

  function addPlace(place, mentions) {
    const marker = L.marker(place.point, {
      icon: L.divIcon({
        className: `map-pin ${place.group}`,
        html: '<span aria-hidden="true"></span>',
        iconSize: [30, 30],
        iconAnchor: [15, 15],
        popupAnchor: [0, -13],
      }),
      title: place.name,
      alt: place.name,
    }).bindPopup(() => popup(place, mentions), {
      minWidth: 212,
      maxWidth: 315,
      maxHeight: Math.min(370, Math.max(210, map.getSize().y - 130)),
      autoPanPaddingTopLeft: [12, 12],
      autoPanPaddingBottomRight: [12, 18],
    });
    marker.on("add", () => marker.getElement()?.setAttribute("aria-label", place.name));
    marker.on("popupopen", () => {
      setActive(place.id);
      const path = MAP_ROUTES[place.id];
      if (path?.length) {
        const color = getComputedStyle(document.documentElement).getPropertyValue(`--${place.group}`).trim();
        highlightedPath = L.polyline(path, { color, weight: 4, opacity: .78, interactive: false }).addTo(map);
      }
    });
    marker.on("popupclose", () => {
      if (highlightedPath) {
        highlightedPath.remove();
        highlightedPath = undefined;
      }
      if (activePlace === place.id) setActive("");
    });
    markers.set(place.id, marker);

    const item = element("li");
    const button = element("button", `place-button ${place.group}`);
    button.type = "button";
    const symbol = element("span", "place-icon");
    symbol.setAttribute("aria-hidden", "true");
    const label = element("span");
    label.append(element("span", "place-name", place.name), element("span", "place-type", place.type));
    const songCount = new Set(mentions.map(({ song }) => song)).size;
    const count = element("span", "place-mentions", String(songCount));
    count.setAttribute("aria-label", `Песен: ${songCount}`);
    button.append(symbol, label, count);
    button.addEventListener("click", () => showMarker(place));
    rowButtons.set(place.id, button);
    item.append(button);
    return item;
  }

  function render() {
    selection += 1;
    map.closePopup();
    setActive("");
    layer.clearLayers();
    markers.clear();
    rowButtons.clear();
    visible = [];
    const list = document.createDocumentFragment();
    const query = normalize(search.value);
    const words = query ? query.split(" ") : [];
    for (const place of placeOrder) {
      if (filter !== "all" && place.group !== filter) continue;
      const matches = getMatches(place, words);
      if (!matches.length) continue;
      visible.push(place);
      list.append(addPlace(place, matches));
    }
    if (clustered) layer.addLayers([...markers.values()]);
    else for (const marker of markers.values()) layer.addLayer(marker);
    placeList.replaceChildren(list);
    byId("result-count").textContent = visible.length === placeOrder.length ? String(placeOrder.length) : `${visible.length} из ${placeOrder.length}`;
    byId("empty").hidden = visible.length > 0;
    byId("fit-map").disabled = visible.length === 0;
  }

  function changeFilter(group) {
    filter = group;
    for (const [key, button] of filterButtons) button.setAttribute("aria-pressed", String(key === group));
    render();
  }

  function showFromCatalog(placeId) {
    catalog.close();
    search.value = "";
    changeFilter("all");
    showMarker(placesById.get(placeId));
  }

  function renderCatalog() {
    const list = element("ol");
    for (const song of songs) {
      const item = element("li", "", `${song.artist} — «${song.title}»`);
      const placeNames = element("small");
      const places = [...new Set(song.mentions.map(({ place }) => place))].filter((id) => placesById.has(id));
      places.forEach((placeId, index) => {
        if (index) placeNames.append(" · ");
        const button = element("button", "catalog-place", placesById.get(placeId).name);
        button.type = "button";
        button.addEventListener("click", () => showFromCatalog(placeId));
        placeNames.append(button);
      });
      item.append(placeNames);
      list.append(item);
    }
    byId("catalog-content").append(list);
  }

  function downloadCsv(event) {
    const rows = [["Место", "Тип", "Цитата", "Исполнитель", "Песня", "Genius", "Пояснение", "Широта", "Долгота"]];
    for (const place of placeOrder) {
      for (const mention of mentionsByPlace.get(place.id)) {
        const song = songsById.get(mention.song);
        rows.push([place.name, place.type, mention.quote, song.artist, song.title, geniusUrl(song),
          mention.note || place.note || "", ...place.point]);
      }
    }
    const csv = rows.map((row) => row.map((cell) => {
      const value = String(cell);
      const safe = /^[=+\-@\t\r]/.test(value) ? "'" + value : value;
      return `"${safe.replaceAll('"', '""')}"`;
    }).join(";")).join("\r\n");
    const url = URL.createObjectURL(new Blob(["\ufeff", csv], { type: "text/csv;charset=utf-8" }));
    event.currentTarget.href = url;
    setTimeout(() => URL.revokeObjectURL(url), 30000);
  }

  const deepLink = new URLSearchParams(location.hash.slice(1)).get("place");
  for (const [key, label] of Object.entries(types)) {
    const button = element("button", "filter", label);
    button.type = "button";
    button.setAttribute("aria-pressed", String(key === filter));
    button.addEventListener("click", () => changeFilter(key));
    filterButtons.set(key, button);
    byId("filters").append(button);
  }
  search.addEventListener("input", render);
  byId("fit-map").addEventListener("click", fitMap);
  byId("home").addEventListener("click", (event) => {
    event.preventDefault();
    search.value = "";
    changeFilter("all");
    fitMap();
  });
  byId("catalog-button").addEventListener("click", () => catalog.showModal());
  byId("catalog-count").textContent = `Песен на карте — ${songs.length}`;
  byId("download-csv").addEventListener("click", downloadCsv);
  renderCatalog();

  render();
  fitMap();
  if (map.getZoom() >= 10) labels.addTo(map);
  if (placesById.has(deepLink)) showMarker(placesById.get(deepLink));
})().catch((error) => {
  const notice = document.getElementById("map-notice");
  notice.textContent = "Не удалось открыть карту. Обновите страницу.";
  notice.hidden = false;
  console.error(error);
});

</script>
</body>
</html>
